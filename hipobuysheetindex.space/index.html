<main><section class="hero"><h1 data-t="title">Hipobuy Spreadsheet</h1><p data-t="intro">Explore the CNFansSP catalog and use Hipobuy to order items from Weidian.</p><form action="https://www.cnfanssp.com/search.html"><input type="hidden" name="channelid" value="2"><input type="search" name="keywords" required placeholder="Search the CNFansSP catalog" aria-label="Search the CNFansSP catalog"><button data-t="search">Search</button></form></section>
<section id="categories"><h2 data-t="categories">Categories</h2><div class="chips" id="chips"></div></section>
<section><div class="section-head"><h2 data-t="latest">Latest products</h2><a href="https://www.cnfanssp.com/AllProducts/" data-t="all">All products</a></div><p id="status" role="status"></p><div class="grid" id="products"></div></section><!-- editorial --></main>
<footer><a href="https://www.cnfanssp.com/" data-t="source">Catalog source · CNFansSP</a></footer>
<script>
const labels=['title','intro','categories','all','join','search','latest','source','buy','loading','error','placeholder'];
const translations={
en:['Hipobuy Spreadsheet','Explore the CNFansSP catalog and use Hipobuy to order items from Weidian.','Categories','All products','Sign up','Search','Latest products','Catalog source · CNFansSP','Open in Hipobuy','Loading products…','Catalog unavailable. Open CNFansSP to browse.','Search the CNFansSP catalog'],
zh:['Hipobuy 商品目录','浏览 CNFansSP 商品目录，通过 Hipobuy 代购微店商品。','分类','全部商品','注册','搜索','最新商品','数据来源 · CNFansSP','在 Hipobuy 打开','正在加载商品…','暂时无法加载，请前往 CNFansSP 浏览。','搜索 CNFansSP 商品'],
fr:['Catalogue Hipobuy','Explorez le catalogue CNFansSP et commandez des articles Weidian via Hipobuy.','Catégories','Tous les produits','Inscription','Rechercher','Derniers produits','Source du catalogue · CNFansSP','Ouvrir dans Hipobuy','Chargement…','Catalogue indisponible. Consultez CNFansSP.','Rechercher dans CNFansSP'],
es:['Catálogo Hipobuy','Explora el catálogo CNFansSP y compra artículos de Weidian con Hipobuy.','Categorías','Todos los productos','Registro','Buscar','Últimos productos','Fuente del catálogo · CNFansSP','Abrir en Hipobuy','Cargando…','Catálogo no disponible. Consulta CNFansSP.','Buscar en CNFansSP'],
de:['Hipobuy-Katalog','Entdecke den CNFansSP-Katalog und bestelle Weidian-Artikel über Hipobuy.','Kategorien','Alle Produkte','Registrieren','Suchen','Neueste Produkte','Katalogquelle · CNFansSP','In Hipobuy öffnen','Wird geladen…','Katalog nicht verfügbar. Besuche CNFansSP.','Im CNFansSP-Katalog suchen']};
const language=document.querySelector('#language'), status=document.querySelector('#status');
const requested=location.pathname.split('/')[1];
language.value=Object.hasOwn(translations,requested)?requested:'en';
const localPath=location.pathname.replace(/^\/(en|zh|fr|es|de)(?=\/)/,'');
const extras={en:['Guides','All questions','All guides'],zh:['指南','全部问题','全部指南'],fr:['Guides','Toutes les questions','Tous les guides'],es:['Guías','Todas las preguntas','Todas las guías'],de:['Ratgeber','Alle Fragen','Alle Ratgeber']};
const chips=document.querySelector('#chips'), productsGrid=document.querySelector('#products');
for(const link of document.querySelectorAll('a[href^="/"]')){
 if(language.value!=='en') link.href='/'+language.value+link.getAttribute('href');
}
if(productsGrid && localPath==='/products/') productsGrid.classList.add('compact');
let state='loading';
function translate(){
 const t=Object.fromEntries(labels.map((label,i)=>[label,translations[language.value][i]]));
 [t.guides,t.allFaq,t.allGuides]=extras[language.value];
 document.documentElement.lang=language.value;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
 const input=document.querySelector('input[type=search]');
 if(input){input.placeholder=t.placeholder;input.setAttribute('aria-label',t.placeholder);}
 if(status) status.textContent=t[state]||'';
}
language.addEventListener('change',()=>{
 location.href=(language.value==='en'?'':'/'+language.value)+localPath;
});
function element(tag,props={},children=[]){
 const node=Object.assign(document.createElement(tag),props);
 node.append(...children);
 return node;
}
translate();
if(chips || productsGrid) fetch('/catalog.json').then(async response=>{
 if(!response.ok) throw Error('Catalog unavailable');
 const {categories,products}=await response.json();
 chips?.append(...categories.map(({name,url})=>element('a',{href:url,textContent:name})));
 for(const product of products){
  const image=element('img',{src:product.image,alt:product.name,loading:'lazy'});
  const info=element('div',{className:'info'},[
   element('a',{href:product.url,textContent:product.name}),
   element('strong',{textContent:product.price?'¥'+product.price:''})
  ]);
  if(product.buy){
   const buy=element('a',{href:product.buy,className:'btn buy'});
   buy.dataset.t='buy';
   info.append(buy);
  }
  productsGrid?.append(element('article',{className:'card'},[element('a',{href:product.url},[image]),info]));
 }
 state='';
}).catch(()=>{state='error'}).finally(translate);
</script></html>
